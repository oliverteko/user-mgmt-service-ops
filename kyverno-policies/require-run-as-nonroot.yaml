# Adapted from https://kyverno.io/policies/pod-security/restricted/require-run-as-nonroot/
# (upstream defaults to Audit; this enforces, and is scoped to our own
# namespaces only - see README.md for why).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must not be allowed to run as root - either the pod-level
      spec.securityContext.runAsNonRoot or every container's own
      securityContext.runAsNonRoot must be true. helm/user-mgmt-service sets
      this at the pod level for backend/frontend (both images already run as
      a non-root user in their Dockerfiles regardless).
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - user-mgmt-*
      validate:
        message: >-
          Running as root is not allowed. Either spec.securityContext.runAsNonRoot
          must be true, or every container's securityContext.runAsNonRoot must be true.
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: "true"
              =(initContainers):
                - =(securityContext):
                    =(runAsNonRoot): "true"
              containers:
                - =(securityContext):
                    =(runAsNonRoot): "true"
          - spec:
              =(initContainers):
                - securityContext:
                    runAsNonRoot: "true"
              containers:
                - securityContext:
                    runAsNonRoot: "true"
