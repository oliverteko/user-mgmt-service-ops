# Adapted from https://kyverno.io/policies/best-practices/disallow-latest-tag/
# (upstream defaults to Audit; this enforces, and is scoped to our own
# namespaces only - see README.md for why).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and can change under you without a
      deployment even happening - an image tag must be present and must not
      be 'latest'. helm/user-mgmt-service already pins backend/frontend to
      a commit-sha tag (build-and-push.yml's promote job), so this only
      catches genuine drift or a hand-edited manifest.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - user-mgmt-*
      validate:
        message: "An image tag is required."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              image: "*:*"
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - user-mgmt-*
      validate:
        message: "Using a mutable image tag e.g. 'latest' is not allowed."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              image: "!*:latest"
