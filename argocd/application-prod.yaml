apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-mgmt-service-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/oliverteko/user-mgmt-service-ops.git
    targetRevision: main
    path: helm/user-mgmt-service
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: secret.create
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: user-mgmt-prod
  # The backend HPA (only enabled in prod) owns spec.replicas once deployed;
  # without this, ArgoCD's selfHeal would revert every scaling decision back
  # to the chart's static replicaCount within ~3 minutes.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
