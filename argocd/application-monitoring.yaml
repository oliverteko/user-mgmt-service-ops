apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.2.3
      helm:
        valueFiles:
          - $values/helm/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/oliverteko/user-mgmt-service-ops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRD manifests (ServiceMonitor, PrometheusRule, Alertmanager, ...)
      # exceed the 262144 byte kubectl.kubernetes.io/last-applied-configuration
      # annotation limit - client-side apply fails without this.
      - ServerSideApply=true
