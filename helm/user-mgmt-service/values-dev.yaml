# Example overlay for a local/dev environment. Only overrides what differs
# from values.yaml - use with:
#   helm upgrade --install user-mgmt-service ./helm/user-mgmt-service -f values-dev.yaml

# Example only, like the rest of this file - a "user_mgmt_dev" database
# doesn't actually exist in terraform/database.tf (only staging/prod do); add
# a digitalocean_database_db resource for it before this override is usable.
database:
  name: user_mgmt_dev

backend:
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 250m
      memory: 384Mi
