# Prod overlay - only overrides what differs from values.yaml. Use with:
#   helm upgrade --install user-mgmt-service ./helm/user-mgmt-service -f values-prod.yaml
# (in practice applied by ArgoCD via argocd/application-prod.yaml)
#
# values.yaml's defaults are already prod-sized (2 backend replicas with HPA
# 2-4, 2 frontend replicas, generous resources/quota, hostless ingress) -
# only the namespace needs overriding.
#
# Prod was temporarily parked at 0 replicas while the node pool was
# 1 vCPU / 2 GB and couldn't fit prod + staging + monitoring. On the
# 2 vCPU / 4 GB pool (terraform/main.tf) it fits again. If prod is ever
# brought back from 0 replicas: the HPA won't scale a Deployment that sits
# at 0, and ArgoCD ignores backend replicas (ignoreDifferences), so run
# `kubectl scale deploy/backend -n user-mgmt-prod --replicas=2` once.

namespace: user-mgmt-prod
