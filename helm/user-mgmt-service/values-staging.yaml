# Staging overlay - only overrides what differs from values.yaml. Use with:
#   helm upgrade --install user-mgmt-service ./helm/user-mgmt-service -f values-staging.yaml
# (in practice applied by ArgoCD via argocd/application-staging.yaml)

namespace: user-mgmt-staging

postgres:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

backend:
  replicaCount: 1
  # The 250m CPU limit this used to carry was the single biggest problem
  # found while load testing: bcrypt makes every login CPU-bound, so even a
  # modest number of concurrent logins pinned each pod at its limit. Once
  # CFS-throttled that hard, pods couldn't answer /actuator/health within the
  # probe timeout, dropped out of the Service's ready endpoints, and the
  # whole backend went unavailable mid-load-test (99.95% request failure)
  # even though the HPA was scaling correctly. 500m gives each replica room
  # to actually serve load and still answer health checks.
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Autoscaling enabled (unlike the earlier single-fixed-replica setup) so the
  # k6 load test (../../loadtest/) has something to actually exercise -
  # staging is where that controlled load runs, not prod. Ceiling kept lower
  # than prod's (3 vs 4) since staging's resourceQuota is tighter. PDB stays
  # off: minAvailable would need to stay below minReplicas (1), so it'd
  # either be pointless or block every voluntary disruption outright.
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
  pdb:
    enabled: false

frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 150m
      memory: 192Mi
  pdb:
    enabled: false

ingress:
  # Distinct from prod's hostless rule so both can coexist behind the same
  # Traefik controller. Test via Host header or an /etc/hosts entry pointing
  # at the Traefik LoadBalancer IP (see k8s/README.md in the app repo).
  host: staging.user-mgmt.local

# Sized to fit the backend at full HPA scale-out (3 x 150m/256Mi requests,
# 3 x 500m/512Mi limits) plus frontend and postgres, with a little headroom -
# the quota rejects pods outright once it's hit, so it has to allow for the
# replicas the HPA is allowed to create, not just the steady-state one.
resourceQuota:
  requests:
    cpu: "1"
    memory: 1536Mi
  limits:
    cpu: "3"
    memory: 3Gi
