# Default values for user-mgmt-service.
# Production-like defaults matching the current DigitalOcean Kubernetes (DOKS) deployment.
# Override per environment with -f values-<env>.yaml and/or --set.

namespace: user-mgmt
createNamespace: true
nameOverride: ""
fullnameOverride: ""
# DigitalOcean Managed PostgreSQL (../../terraform/database.tf) - no postgres
# Deployment/Service/PVC in this chart anymore. host/port/sslMode come from
# `terraform output` and are shared across environments (one managed
# cluster, see database.tf for why); only `name` differs per environment -
# this default matches the prod database, values-staging.yaml overrides it,
# same pattern as ingress.host below.
database:
  host: "REPLACE_ME.db.ondigitalocean.com" # terraform output database_host
  port: 25060 # terraform output database_port
  name: user_mgmt_prod
  sslMode: require
backend:
  image:
    repository: ghcr.io/oliverteko/user-mgmt-service-backend
    tag: ccce468ee5ddcdc005f11d3f1d1ecccc92aaa5d0
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The image's ENTRYPOINT sets -XX:MaxRAMPercentage=75, which in a 512Mi
  # container gives a ~384Mi heap - plus ~130Mi metaspace/code cache plus
  # thread stacks, that overshoots the limit as soon as the heap fills, and
  # the pod gets OOMKilled (seen live under the k6 load test). An explicit
  # -Xmx takes precedence over MaxRAMPercentage, so this caps the heap
  # without rebuilding the image. Keep it well under the memory limit.
  javaToolOptions: "-Xmx256m"
  probes:
    # httpGet against actuator's health groups (management.endpoint.health.probes.enabled=true,
    # app repo application.properties; /actuator/health/** permitAll'd in
    # WebSecurityConfig) - readiness reflects real DB connectivity, not just
    # an open TCP port. A startupProbe (backend-deployment.yaml) gates
    # liveness/readiness until the app is actually up, so these budgets only
    # need to cover steady-state hiccups, not a cold JVM start.
    periodSeconds: 10
    failureThreshold: 6
    # Kubernetes' default probe timeout is 1s - found live under a k6 load
    # test that a CPU-throttled pod (all replicas pegged at their CPU limit)
    # can take longer than that just to answer a health check, so the
    # default was killing perfectly-alive-but-slow pods and forcing them
    # into a cold-restart loop, right when they were needed most. This gives
    # a slow-but-responsive pod room to answer before being marked failed.
    timeoutSeconds: 5
    # Cold start observed 80-180s+ under node CPU contention (JVM +
    # Hibernate + actuator init) - 30*10s gives 5 minutes of headroom before
    # the startupProbe itself gives up.
    startupFailureThreshold: 30
  # HPA takes over scaling within [minReplicas, maxReplicas] based on CPU
  # load; replicaCount above only seeds the initial/fallback replica count
  # (see the `if not autoscaling.enabled` guard in backend-deployment.yaml).
  # Requires metrics-server in the cluster (installed by argocd-bootstrap.yml).
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # minAvailable must stay below minReplicas, or a voluntary disruption
  # (node drain, cluster upgrade) could never proceed. Disabled in
  # values-staging.yaml, which runs a single replica.
  pdb:
    enabled: true
    minAvailable: 1
frontend:
  image:
    repository: ghcr.io/oliverteko/user-mgmt-service-frontend
    tag: ccce468ee5ddcdc005f11d3f1d1ecccc92aaa5d0
    pullPolicy: IfNotPresent
  # Static replica count (no HPA - only the backend autoscales, see above).
  # >1 so the PDB below is meaningful and Traefik actually load-balances
  # across replicas.
  replicaCount: 2
  service:
    port: 3000
  # Same probe shape as the backend, and for the same reason: Kubernetes'
  # default probe timeout is 1s, which a Next.js server under CPU contention
  # can't always answer. That was killing the staging frontend with SIGTERM
  # (exit 143) into CrashLoopBackOff even though nothing was actually wrong
  # with it. startupProbe covers the boot, the timeout covers slow answers.
  probes:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    startupFailureThreshold: 30
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  pdb:
    enabled: true
    minAvailable: 1
  env:
    # Runtime env var, server-side only. Maps to INTERNAL_API_URL. All backend
    # calls are proxied server-side by the frontend's own API routes
    # (frontend/app/api/*/route.ts) - the browser never talks to the backend
    # directly, so no public/build-time API URL is needed at all.
    internalApiUrl: "http://backend:8080"
config:
  springJpaHibernateDdlAuto: update
  jwtIssuer: Spring
  jwtExpirationMillis: "86400000"
secret:
  # true  = this chart renders a Secret from the values below (defaults are
  #         placeholders only - override via --set or an untracked values file
  #         at install/upgrade time, never commit real values).
  # false = no Secret is rendered; `secret.name` must already exist in the
  #         cluster (e.g. created imperatively via `kubectl create secret
  #         generic`), matching the current production workflow.
  create: true
  name: app-secret
  dbUsername: "REPLACE_ME"
  dbPassword: "REPLACE_ME"
  jwtSecret: "REPLACE_ME"
ingress:
  enabled: true
  className: traefik
  # Empty = hostless rule (matches any incoming Host header) - the default
  # for a single environment. Set per-environment (values-staging.yaml,
  # values-prod.yaml) once multiple environments share the same Ingress
  # controller, so their rules don't collide.
  host: ""
# Caps total requests/limits for every resource in this environment's
# namespace, so one environment (e.g. staging) can't starve others sharing
# the same cluster. Sized generously here for the base/prod defaults;
# values-staging.yaml overrides with tighter numbers.
resourceQuota:
  enabled: true
  requests:
    cpu: "2"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 4Gi
# Scraped by the kube-prometheus-stack Prometheus instance (installed
# separately, see ../kube-prometheus-stack/values.yaml) via the ServiceMonitor
# below. Requires management.endpoints.web.exposure.include=health,prometheus
# on the backend (see the app repo's application.properties).
monitoring:
  enabled: true
  namespace: monitoring
  scrapeInterval: 15s
  errorRate:
    threshold: 0.05
    window: 5m
    for: 5m
# Restricts ingress to each namespace's own pods plus the Ingress controller,
# so environments sharing this cluster (e.g. staging and prod) can't reach
# each other's pods over the network. See templates/networkpolicy.yaml.
networkPolicy:
  enabled: true
  ingressNamespace: traefik
