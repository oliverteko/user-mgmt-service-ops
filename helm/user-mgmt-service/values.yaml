config:
  springJpaHibernateDdlAuto: update
  jwtIssuer: Spring
  jwtExpirationMillis: "86400000"
secret:
  # true  = this chart renders a Secret from the values below (defaults are
  #         placeholders only - override via --set or an untracked values file
  #         at install/upgrade time, never commit real values).
  # false = no Secret is rendered; `secret.name` must already exist in the
  #         cluster (e.g. created imperatively via `kubectl create secret
  #         generic`), matching the current production workflow.
  create: true
  name: app-secret
  dbUsername: "REPLACE_ME"
  dbPassword: "REPLACE_ME"
  jwtSecret: "REPLACE_ME"
ingress:
  enabled: true
  className: traefik
  # Empty = hostless rule (matches any incoming Host header) - the default
  # for a single environment. Set per-environment (values-staging.yaml,
  # values-prod.yaml) once multiple environments share the same Ingress
  # controller, so their rules don't collide.
  host: ""
# Caps total requests/limits for every resource in this environment's
# namespace, so one environment (e.g. staging) can't starve others sharing
# the same cluster. Sized generously here for the base/prod defaults;
# values-staging.yaml overrides with tighter numbers.
resourceQuota:
  enabled: true
  # prod at full scale-out: 4 backend + 2 frontend + 2 module-service, plus
  # one rolling-update surge pod
  requests:
    cpu: "2"
    memory: 3Gi
  limits:
    cpu: "5"
    memory: 5Gi
# Scraped by the kube-prometheus-stack Prometheus instance (installed
# separately, see ../kube-prometheus-stack/values.yaml) via the ServiceMonitor
# below. Requires management.endpoints.web.exposure.include=health,prometheus
# on the backend (see the app repo's application.properties).
monitoring:
  enabled: true
  namespace: monitoring
  scrapeInterval: 15s
  errorRate:
    threshold: 0.05
    window: 5m
    for: 5m
# Restricts ingress to each namespace's own pods plus the Ingress controller,
# so environments sharing this cluster (e.g. staging and prod) can't reach
# each other's pods over the network. See templates/networkpolicy.yaml.
networkPolicy:
  enabled: true
  ingressNamespace: traefik
  # Egress the backend must NOT reach - the module_service's managed MySQL
  # (private IP of `terraform output module_database_host`, resolved inside
  # the cluster: `kubectl run -it --rm dns --image=busybox -- nslookup <host>`).
  # Empty = no backend egress policy.
  backendEgressDenyCidrs:
    - 10.114.0.8/32 # module-service-mysql (private)
