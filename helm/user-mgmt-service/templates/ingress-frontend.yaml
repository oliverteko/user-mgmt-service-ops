{{- if .Values.ingress.enabled }}
# ingress.host empty (default): hostless rule matches any incoming Host
# header - fine for a single environment on the cluster, since all backend
# calls are proxied server-side by the frontend (see frontend/app/api/*/route.ts)
# and nothing needs to know the external IP ahead of time. Once more than one
# environment shares the same Ingress controller (e.g. staging + prod), set
# ingress.host per environment so their rules don't both match everything.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "user-mgmt-service.componentLabels" (dict "component" "frontend" "context" $) | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
