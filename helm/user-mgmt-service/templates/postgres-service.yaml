apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "user-mgmt-service.componentLabels" (dict "component" "postgres" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "user-mgmt-service.componentSelectorLabels" (dict "component" "postgres" "context" $) | nindent 4 }}
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
