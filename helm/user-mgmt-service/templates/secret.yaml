{{- if .Values.secret.create }}
# Chart-managed Secret. Defaults in values.yaml are placeholders only - supply
# real values at install/upgrade time via --set or an untracked values file,
# never commit them. Set secret.create=false to use a pre-existing Secret
# (e.g. created imperatively via `kubectl create secret generic`) instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "user-mgmt-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USERNAME: {{ .Values.secret.dbUsername | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
{{- end }}
