apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "user-mgmt-service.componentLabels" (dict "component" "frontend" "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  # maxUnavailable: 0 - never fewer ready replicas than before the rollout,
  # so updates cause no service interruption. maxSurge: 1 brings up one new
  # pod at a time rather than replacing everything at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "user-mgmt-service.componentSelectorLabels" (dict "component" "frontend" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "user-mgmt-service.componentSelectorLabels" (dict "component" "frontend" "context" $) | nindent 8 }}
    spec:
      # Satisfies the require-run-as-nonroot Kyverno ClusterPolicy
      # (../../kyverno-policies) - also true at the image layer already
      # (frontend/Dockerfile: USER nextjs), this just makes it explicit/enforced.
      # The image's USER is a name (nextjs), which the kubelet can't check
      # against runAsNonRoot ("image has non-numeric user") - so the numeric
      # UID/GID it maps to inside the image (uid=100, gid=101) is set here.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: frontend
          image: {{ include "user-mgmt-service.image" (dict "image" .Values.frontend.image "context" $) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          env:
            - name: INTERNAL_API_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: INTERNAL_API_URL
          # "/" is not gated by middleware.ts and doesn't depend on the backend,
          # so it's a safe, unauthenticated probe target. startupProbe gates
          # the other two until Next.js has actually booted (see the comment
          # on frontend.probes in values.yaml).
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: {{ .Values.frontend.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.probes.startupFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: {{ .Values.frontend.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: {{ .Values.frontend.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
