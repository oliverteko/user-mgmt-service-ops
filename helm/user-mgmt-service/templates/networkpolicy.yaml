{{- if .Values.networkPolicy.enabled }}
# Applied identically in every environment's namespace: since both sides of
# any cross-namespace connection deny non-local ingress, this blocks traffic
# in both directions - staging and prod (and any other namespace) can't reach
# each other's pods, even though they share one cluster. Traffic from the
# Traefik namespace stays allowed so the shared Ingress controller can still
# reach the frontend; from the monitoring namespace so Prometheus can scrape
# pods directly (ServiceMonitor scrapes bypass the Service); intra-namespace
# traffic (frontend->backend) is unaffected.
#
# The module_service is excluded here and gets its own, narrower policy below
# (NetworkPolicies are additive - if this one also selected it, every pod in
# the namespace could reach it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "user-mgmt-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          - module-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        {{- if .Values.monitoring.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
        {{- end }}
{{- if .Values.moduleService.enabled }}
---
# The module_service's API is only for the backend (plus Prometheus scraping
# /metrics) - not the frontend, not other namespaces, not the Ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: module-service-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "user-mgmt-service.componentLabels" (dict "component" "module-service" "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt-service.componentSelectorLabels" (dict "component" "module-service" "context" $) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "user-mgmt-service.componentSelectorLabels" (dict "component" "backend" "context" $) | nindent 14 }}
        {{- if .Values.monitoring.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
        {{- end }}
      ports:
        - port: http
{{- end }}
{{- with .Values.networkPolicy.backendEgressDenyCidrs }}
---
# The backend must not reach the module_service's MySQL directly - only via
# the module_service's REST API. It doesn't have the credentials anyway
# (module-service-secret is only mounted by the module_service); this also
# blocks it at the network level. Everything else stays reachable: pods in
# this namespace (module-service), cluster DNS, and the outside world incl.
# the backend's own managed PostgreSQL - minus the CIDRs listed in
# networkPolicy.backendEgressDenyCidrs (the MySQL cluster's private IP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "user-mgmt-service.componentLabels" (dict "component" "backend" "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "user-mgmt-service.componentSelectorLabels" (dict "component" "backend" "context" $) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml . | nindent 14 }}
{{- end }}
{{- end }}
