# Declarative config for the prometheus-community/kube-prometheus-stack
# chart, installed cluster-wide into the `monitoring` namespace via
# argocd/application-monitoring.yaml (multi-source Application: this file is
# passed as the Helm values source, the chart itself comes from the upstream
# Helm repo). Node-exporter, kube-state-metrics and the default Grafana
# dashboards (incl. per-pod CPU/Memory) stay on their chart defaults - only
# what needs to differ from those defaults is set here.

prometheus:
  prometheusSpec:
    # Without this, Prometheus only watches ServiceMonitors/PrometheusRules
    # carrying this release's Helm label - our backend's ServiceMonitor
    # (helm/user-mgmt-service chart, a separate Helm release per environment)
    # would never be picked up otherwise.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    # Lets k6 (../../loadtest/) push its own load-generator metrics
    # (k6_vus, k6_http_req_duration_seconds, ...) straight into this
    # Prometheus via remote_write, so load and effect show up side by side.
    enableRemoteWriteReceiver: true
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    # Pre-created imperatively (argocd-bootstrap.yml, ALERTMANAGER_WEBHOOK_URL
    # secret) - same pattern as the app's own app-secret, so the webhook URL
    # never enters git. Mounted at /etc/alertmanager/secrets/alertmanager-webhook/.
    secrets:
      - alertmanager-webhook
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  config:
    route:
      receiver: generic-webhook
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: generic-webhook
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-webhook/url
            send_resolved: true
      # The chart always appends a "Watchdog -> null" route to whatever
      # route we provide (silences Prometheus's synthetic always-firing
      # liveness alert) - without a receiver actually named "null" to match
      # it, Alertmanager's own config validation rejects the whole config:
      # "undefined receiver \"null\" used in route". Found live, only
      # reproduces once the Alertmanager Operator actually loads the
      # rendered secret - `helm template` alone won't catch it.
      - name: "null"

grafana:
  # Ships the chart's curated dashboards (Kubernetes / Compute Resources /
  # Pod, Node, etc.) - covers the required per-pod CPU/Memory visualization
  # with no extra provisioning needed.
  defaultDashboardsEnabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.user-mgmt.local
    path: /
  # Custom dashboard for the user-mgmt-service backend: request rate,
  # response time and error rate, all derived from the actuator/prometheus
  # metrics scraped via the backend ServiceMonitor.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: user-mgmt-service
          orgId: 1
          folder: user-mgmt-service
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/user-mgmt-service
  dashboards:
    user-mgmt-service:
      load-test-hpa:
        json: |
          {
            "title": "user-mgmt-service / Load Test & HPA",
            "uid": "user-mgmt-service-load-test-hpa",
            "schemaVersion": 39,
            "version": 1,
            "timezone": "browser",
            "refresh": "10s",
            "time": { "from": "now-30m", "to": "now" },
            "panels": [
              {
                "id": 1,
                "title": "Active VUs (k6)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                "targets": [
                  { "expr": "sum(k6_vus)", "legendFormat": "VUs", "refId": "A" }
                ]
              },
              {
                "id": 2,
                "title": "HPA Desired vs. Current Replicas (backend)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"backend\"}",
                    "legendFormat": "desired ({{namespace}})",
                    "refId": "A"
                  },
                  {
                    "expr": "kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=\"backend\"}",
                    "legendFormat": "current ({{namespace}})",
                    "refId": "B"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Backend Pod Replicas (actual)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "kube_deployment_status_replicas{deployment=\"backend\", namespace=~\"user-mgmt-.*\"}",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Request Rate",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
                "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"backend\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 5,
                "title": "Avg Response Time",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
                "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_sum{job=\"backend\"}[1m])) by (namespace) / sum(rate(http_server_requests_seconds_count{job=\"backend\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 6,
                "title": "Error Rate (5xx)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
                "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"backend\", status=~\"5..\"}[1m])) by (namespace) / sum(rate(http_server_requests_seconds_count{job=\"backend\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              }
            ]
          }
      backend-http:
        json: |
          {
            "title": "user-mgmt-service / Backend HTTP",
            "uid": "user-mgmt-service-backend-http",
            "schemaVersion": 39,
            "version": 1,
            "timezone": "browser",
            "refresh": "30s",
            "time": { "from": "now-6h", "to": "now" },
            "panels": [
              {
                "id": 1,
                "title": "Request Rate",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"backend\"}[5m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Avg Response Time",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_sum{job=\"backend\"}[5m])) by (namespace) / sum(rate(http_server_requests_seconds_count{job=\"backend\"}[5m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Error Rate (5xx)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"backend\", status=~\"5..\"}[5m])) by (namespace) / sum(rate(http_server_requests_seconds_count{job=\"backend\"}[5m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              }
            ]
          }
