# Declarative config for the prometheus-community/kube-prometheus-stack
# chart, installed cluster-wide into the `monitoring` namespace via
# argocd/application-monitoring.yaml (multi-source Application: this file is
# passed as the Helm values source, the chart itself comes from the upstream
# Helm repo). Node-exporter, kube-state-metrics and the default Grafana
# dashboards (incl. per-pod CPU/Memory) stay on their chart defaults - only
# what needs to differ from those defaults is set here.

prometheus:
  prometheusSpec:
    # Without this, Prometheus only watches ServiceMonitors/PrometheusRules
    # carrying this release's Helm label - our backend's ServiceMonitor
    # (helm/user-mgmt-service chart, a separate Helm release per environment)
    # would never be picked up otherwise.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    # Lets k6 (../../loadtest/) push its own load-generator metrics
    # (k6_vus, k6_http_req_duration_seconds, ...) straight into this
    # Prometheus via remote_write, so load and effect show up side by side.
    enableRemoteWriteReceiver: true
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    # Pre-created imperatively (argocd-bootstrap.yml, ALERTMANAGER_WEBHOOK_URL
    # secret) - same pattern as the app's own app-secret, so the webhook URL
    # never enters git. Mounted at /etc/alertmanager/secrets/alertmanager-webhook/.
    secrets:
      - alertmanager-webhook
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  config:
    route:
      receiver: generic-webhook
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Both fire permanently by design (Watchdog = "the alerting pipeline
        # works" heartbeat, InfoInhibitor = mutes info-level alerts) - not
        # notifications. Setting `routes` replaces the chart's default list,
        # which routed them to "null", so both have to be listed here.
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: generic-webhook
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-webhook/url
            send_resolved: true
      # Target of the Watchdog/InfoInhibitor route above. (Without our own
      # `routes` the chart adds a default Watchdog -> "null" route, and
      # Alertmanager rejects the whole config if no receiver of that name
      # exists - found live.)
      - name: "null"

# DOKS runs the control plane (scheduler, controller-manager, etcd) managed
# by DigitalOcean and not scrapeable from inside the cluster, and uses Cilium
# instead of kube-proxy. Left enabled, the chart scrapes targets that can
# never exist and fires KubeSchedulerDown / KubeControllerManagerDown /
# KubeProxyDown permanently - false alarms on the notification channel.
# Disabling them drops both the scrape config and those rules.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  # Ships the chart's curated dashboards (Kubernetes / Compute Resources /
  # Pod, Node, etc.) - covers the required per-pod CPU/Memory visualization
  # with no extra provisioning needed.
  defaultDashboardsEnabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.user-mgmt.local
    path: /
  # Custom dashboards: backend HTTP (request rate, response time, error rate
  # from actuator/prometheus), load test & HPA, and the module_service
  # (request rate, response time, error rate from its /metrics, resources vs.
  # limits, and the backend's timeout/retry/circuit-breaker view of it).
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: user-mgmt-service
          orgId: 1
          folder: user-mgmt-service
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/user-mgmt-service
  dashboards:
    user-mgmt-service:
      load-test-hpa:
        json: |
          {
            "title": "user-mgmt-service / Load Test & HPA",
            "uid": "user-mgmt-service-load-test-hpa",
            "schemaVersion": 39,
            "version": 1,
            "timezone": "browser",
            "refresh": "10s",
            "time": { "from": "now-30m", "to": "now" },
            "panels": [
              {
                "id": 1,
                "title": "Active VUs (k6)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                "targets": [
                  { "expr": "sum(k6_vus)", "legendFormat": "VUs", "refId": "A" }
                ]
              },
              {
                "id": 2,
                "title": "HPA Desired vs. Current Replicas (backend)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"backend\"}",
                    "legendFormat": "desired ({{namespace}})",
                    "refId": "A"
                  },
                  {
                    "expr": "kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=\"backend\"}",
                    "legendFormat": "current ({{namespace}})",
                    "refId": "B"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Backend Pod Replicas (actual)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "kube_deployment_status_replicas{deployment=\"backend\", namespace=~\"user-mgmt-.*\"}",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Request Rate",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
                "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"backend\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 5,
                "title": "Avg Response Time",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
                "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_sum{job=\"backend\"}[1m])) by (namespace) / sum(rate(http_server_requests_seconds_count{job=\"backend\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 6,
                "title": "Error Rate (5xx)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
                "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"backend\", status=~\"5..\"}[1m])) by (namespace) / sum(rate(http_server_requests_seconds_count{job=\"backend\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              }
            ]
          }
      backend-http:
        json: |
          {
            "title": "user-mgmt-service / Backend HTTP",
            "uid": "user-mgmt-service-backend-http",
            "schemaVersion": 39,
            "version": 1,
            "timezone": "browser",
            "refresh": "30s",
            "time": { "from": "now-6h", "to": "now" },
            "panels": [
              {
                "id": 1,
                "title": "Request Rate",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"backend\"}[5m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Avg Response Time",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_sum{job=\"backend\"}[5m])) by (namespace) / sum(rate(http_server_requests_seconds_count{job=\"backend\"}[5m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Error Rate (5xx)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
                "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{job=\"backend\", status=~\"5..\"}[5m])) by (namespace) / sum(rate(http_server_requests_seconds_count{job=\"backend\"}[5m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              }
            ]
          }
      module-service:
        json: |
          {
            "title": "user-mgmt-service / Module Service",
            "uid": "user-mgmt-service-module-service",
            "schemaVersion": 39,
            "version": 1,
            "timezone": "browser",
            "refresh": "10s",
            "time": {
              "from": "now-30m",
              "to": "now"
            },
            "panels": [
              {
                "id": 100,
                "type": "row",
                "title": "module_service HTTP (from its /metrics)",
                "collapsed": false,
                "gridPos": {
                  "h": 1,
                  "w": 24,
                  "x": 0,
                  "y": 0
                },
                "panels": []
              },
              {
                "id": 1,
                "title": "Request Rate",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 8,
                  "x": 0,
                  "y": 1
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(rate(http_requests_total{job=\"module-service\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 2,
                "title": "Response Time (p95 / avg)",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 8,
                  "x": 8,
                  "y": 1
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"module-service\"}[1m])) by (le, namespace))",
                    "legendFormat": "p95 {{namespace}}",
                    "refId": "A"
                  },
                  {
                    "expr": "sum(rate(http_request_duration_seconds_sum{job=\"module-service\"}[1m])) by (namespace) / sum(rate(http_request_duration_seconds_count{job=\"module-service\"}[1m])) by (namespace)",
                    "legendFormat": "avg {{namespace}}",
                    "refId": "B"
                  }
                ]
              },
              {
                "id": 3,
                "title": "Error Rate (5xx)",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 8,
                  "x": 16,
                  "y": 1
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percentunit"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(rate(http_requests_total{job=\"module-service\", status=\"5xx\"}[1m])) by (namespace) / sum(rate(http_requests_total{job=\"module-service\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 4,
                "title": "Requests by Endpoint and Status",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 24,
                  "x": 0,
                  "y": 9
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(rate(http_requests_total{job=\"module-service\"}[1m])) by (namespace, method, handler, status)",
                    "legendFormat": "{{namespace}} {{method}} {{handler}} {{status}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 101,
                "type": "row",
                "title": "Resources vs. limits (vertical scaling)",
                "collapsed": false,
                "gridPos": {
                  "h": 1,
                  "w": 24,
                  "x": 0,
                  "y": 17
                },
                "panels": []
              },
              {
                "id": 5,
                "title": "CPU per Pod vs. Limit",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 18
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "cores"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"user-mgmt-.*\", pod=~\"module-service-.*\", container=\"module-service\"}[1m])) by (namespace, pod)",
                    "legendFormat": "{{namespace}} {{pod}}",
                    "refId": "A"
                  },
                  {
                    "expr": "max(kube_pod_container_resource_limits{namespace=~\"user-mgmt-.*\", pod=~\"module-service-.*\", container=\"module-service\", resource=\"cpu\"}) by (namespace)",
                    "legendFormat": "limit {{namespace}}",
                    "refId": "B"
                  }
                ]
              },
              {
                "id": 6,
                "title": "Memory per Pod vs. Limit",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 18
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(container_memory_working_set_bytes{namespace=~\"user-mgmt-.*\", pod=~\"module-service-.*\", container=\"module-service\"}) by (namespace, pod)",
                    "legendFormat": "{{namespace}} {{pod}}",
                    "refId": "A"
                  },
                  {
                    "expr": "max(kube_pod_container_resource_limits{namespace=~\"user-mgmt-.*\", pod=~\"module-service-.*\", container=\"module-service\", resource=\"memory\"}) by (namespace)",
                    "legendFormat": "limit {{namespace}}",
                    "refId": "B"
                  }
                ]
              },
              {
                "id": 7,
                "title": "CPU Throttling",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 26
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percentunit"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(rate(container_cpu_cfs_throttled_periods_total{namespace=~\"user-mgmt-.*\", pod=~\"module-service-.*\", container=\"module-service\"}[1m])) by (namespace, pod) / sum(rate(container_cpu_cfs_periods_total{namespace=~\"user-mgmt-.*\", pod=~\"module-service-.*\", container=\"module-service\"}[1m])) by (namespace, pod)",
                    "legendFormat": "{{namespace}} {{pod}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 8,
                "title": "Container Restarts",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 26
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "short"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(kube_pod_container_status_restarts_total{namespace=~\"user-mgmt-.*\", container=\"module-service\"}) by (namespace, pod)",
                    "legendFormat": "{{namespace}} {{pod}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 102,
                "type": "row",
                "title": "Backend -> module_service (timeout / retry / circuit breaker)",
                "collapsed": false,
                "gridPos": {
                  "h": 1,
                  "w": 24,
                  "x": 0,
                  "y": 34
                },
                "panels": []
              },
              {
                "id": 9,
                "title": "Backend Client Calls by Outcome",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 8,
                  "x": 0,
                  "y": 35
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "reqps"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(rate(http_client_requests_seconds_count{job=\"backend\", client_name=\"module-service\"}[1m])) by (namespace, outcome)",
                    "legendFormat": "{{namespace}} {{outcome}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 10,
                "title": "Backend Client Latency (avg)",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 8,
                  "x": 8,
                  "y": 35
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(rate(http_client_requests_seconds_sum{job=\"backend\", client_name=\"module-service\"}[1m])) by (namespace) / sum(rate(http_client_requests_seconds_count{job=\"backend\", client_name=\"module-service\"}[1m])) by (namespace)",
                    "legendFormat": "{{namespace}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 11,
                "title": "Circuit Breaker State",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 8,
                  "x": 16,
                  "y": 35
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "short"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "max(resilience4j_circuitbreaker_state{job=\"backend\", name=\"moduleService\"} == 1) by (namespace, state)",
                    "legendFormat": "{{namespace}} {{state}}",
                    "refId": "A"
                  }
                ],
                "description": "1 = the breaker is in this state (closed / open / half_open)"
              },
              {
                "id": 12,
                "title": "Retries",
                "type": "timeseries",
                "gridPos": {
                  "h": 8,
                  "w": 24,
                  "x": 0,
                  "y": 43
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "short"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "expr": "sum(increase(resilience4j_retry_calls_total{job=\"backend\", name=\"moduleService\"}[5m])) by (namespace, kind)",
                    "legendFormat": "{{namespace}} {{kind}}",
                    "refId": "A"
                  }
                ]
              }
            ]
          }
